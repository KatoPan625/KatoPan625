name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # daily at 07:00 Vietnam time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # GH_STATS_TOKEN: classic PAT with repo + read:user scopes, so private repos are counted
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=0e1726&title_color=c8a96a&text_color=ece4d4&icon_color=c8a96a&include_all_commits=true&custom_title=Ph%C6%B0%E1%BB%9Bc%20An's%20GitHub%20Stats
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=0e1726&title_color=c8a96a&text_color=ece4d4&icon_color=c8a96a
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
