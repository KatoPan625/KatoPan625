  <!-- ===== I. About ===== -->
  <g class="fade" style="animation-delay:1.8s">
    <text class="ink" x="600" y="528" font-size="24" text-anchor="middle">I'm <tspan class="gold" font-weight="600">Phước An</tspan>, though most people simply call me <tspan class="gold" font-weight="600">Pan</tspan>.</text>
    <text class="ink" x="600" y="564" font-size="24" text-anchor="middle">I study Information Technology at <tspan class="gold" font-weight="600">UTH</tspan>, design backend services and APIs,</text>
    <text class="ink" x="600" y="600" font-size="24" text-anchor="middle">and build web and mobile apps with React, Next.js and Flutter.</text>
  </g>

