<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1184" viewBox="0 0 1200 1184" role="img" aria-labelledby="t d">
  <title id="t">Phước An (Pan): Backend &amp; API, Web &amp; App developer, IT student at UTH</title>
  <desc id="d">About: I'm Phước An, though most people simply call me Pan. I study Information Technology at UTH, design backend services and APIs, and build web and mobile apps with React, Next.js and Flutter. Toolkit: Backend: Python, TypeScript, JavaScript, PostgreSQL, Supabase. Web: React, Next.js. Mobile: Flutter, Dart. Tools: Git, GitHub, Docker, Vercel. Languages: Vietnamese, English.</desc>
  <style>
    :root { --bg:#0e1726; --ink:#ece4d4; --muted:#a3aab8; --gold:#c8a96a; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f6f1e7; --ink:#1b2a44; --muted:#5f584b; --gold:#85672e; }
    }
    text { font-family: 'Cormorant Garamond','Palatino Linotype','Book Antiqua',Palatino,Cambria,Georgia,serif; }
    .bg { fill: var(--bg); }
    .f1 { fill: none; stroke: var(--gold); stroke-width: 1.2; }
    .f2 { fill: none; stroke: var(--gold); stroke-width: .6; opacity: .55; }
    .gold { fill: var(--gold); }
    .caps { fill: var(--gold); font-size: 14px; letter-spacing: 4px; }
    .ink { fill: var(--ink); }
    .muted { fill: var(--muted); }
    .knock { paint-order: stroke; stroke: var(--bg); stroke-width: 14px; }
    .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
    .draw { stroke-dasharray: 5000; stroke-dashoffset: 5000; animation: draw 3s ease-out forwards; }
    .spine { stroke: var(--gold); stroke-width: 1.2; stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw 1s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .nstroke { fill: none; stroke: var(--gold); stroke-width: 1.1; stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 2.8s ease-in-out .3s forwards; }
    .nfill { opacity: 0; animation: fade 1.4s ease-out 2s forwards; }
    .dust { fill: var(--gold); opacity: 0; animation: rise linear infinite; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: .7; } 85% { opacity: .5; } 100% { opacity: 0; transform: translateY(-140px); } }
    @media (prefers-reduced-motion: reduce) {
      .fade { animation: none; opacity: 1; } .draw, .spine { animation: none; stroke-dashoffset: 0; } .motion { display: none; }
      .nstroke { animation: none; stroke-dashoffset: 0; } .nfill { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="0">
      <stop offset="0" style="stop-color:var(--gold);stop-opacity:0"/>
      <stop offset=".5" style="stop-color:var(--gold);stop-opacity:.95"/>
      <stop offset="1" style="stop-color:var(--gold);stop-opacity:0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="290 0;780 0;780 0" keyTimes="0;.45;1" dur="7s" begin="3.4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glint" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2"/></filter>
    <!-- a chapter heading: rules either side of a centred label, a diamond above where the spine lands -->
    <g id="dia"><path class="gold" d="M0 -6L6 0L0 6L-6 0Z"/></g>
  </defs>

