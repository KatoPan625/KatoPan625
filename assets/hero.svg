<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t">
  <title id="t">Phước An (Pan): Backend &amp; API, Web &amp; App developer, IT student at UTH</title>
  <style>
    :root { --bg:#0e1726; --panel:#121d30; --ink:#ece4d4; --muted:#a3aab8; --gold:#c8a96a; --rule:#2b3a55; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f6f1e7; --panel:#efe8da; --ink:#1b2a44; --muted:#5f584b; --gold:#85672e; --rule:#d6cbb5; }
    }
    text { font-family: 'Cormorant Garamond','Palatino Linotype','Book Antiqua',Palatino,Cambria,Georgia,serif; }
    .bg { fill: var(--bg); }
    .f1 { fill: none; stroke: var(--gold); stroke-width: 1.2; }
    .f2 { fill: none; stroke: var(--gold); stroke-width: .6; opacity: .55; }
    .gold { fill: var(--gold); }
    .caps { fill: var(--gold); font-size: 14px; letter-spacing: 4px; }
    .ink { fill: var(--ink); }
    .muted { fill: var(--muted); }
    .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
    .draw { stroke-dasharray: 3400; stroke-dashoffset: 3400; animation: draw 2.4s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .nstroke { fill: none; stroke: var(--gold); stroke-width: 1.1; stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 2.8s ease-in-out .3s forwards; }
    .nfill { opacity: 0; animation: fade 1.4s ease-out 2s forwards; }
    .dust { fill: var(--gold); opacity: 0; animation: rise linear infinite; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: .7; } 85% { opacity: .5; } 100% { opacity: 0; transform: translateY(-140px); } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; } .draw { animation: none; stroke-dashoffset: 0; } .motion { display: none; } .nstroke { animation: none; stroke-dashoffset: 0; } .nfill { animation: none; opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="0">
      <stop offset="0" style="stop-color:var(--gold);stop-opacity:0"/>
      <stop offset=".5" style="stop-color:var(--gold);stop-opacity:.95"/>
      <stop offset="1" style="stop-color:var(--gold);stop-opacity:0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="290 0;780 0;780 0" keyTimes="0;.45;1" dur="7s" begin="3.4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glint" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect class="bg" width="1200" height="440"/>
  <rect class="f1 draw" x="18" y="18" width="1164" height="404"/>
  <rect class="f2 draw" x="26" y="26" width="1148" height="388"/>
  <path class="gold" d="M18 13L23 18L18 23L13 18Z"/>
  <path class="gold" d="M1182 13L1187 18L1182 23L1177 18Z"/>
  <path class="gold" d="M18 417L23 422L18 427L13 422Z"/>
  <path class="gold" d="M1182 417L1187 422L1182 427L1177 422Z"/>
  <text class="gold" x="600" y="330" font-size="300" font-style="italic" text-anchor="middle" opacity=".06">PA</text>

  <text class="caps fade" x="600" y="112" text-anchor="middle" style="animation-delay:.2s">GITHUB  ·  KATOPAN625  ·  EST. MMXXIV</text>
  <text class="nstroke" x="600" y="204" font-size="92" font-weight="500" text-anchor="middle">Phước An</text>
  <text class="ink nfill" x="600" y="204" font-size="92" font-weight="500" text-anchor="middle">Phước An</text>
  <text class="motion" x="600" y="204" font-size="92" font-weight="500" text-anchor="middle" fill="url(#sheen)">Phước An</text>
  <text class="muted fade" x="600" y="250" font-size="26" font-style="italic" text-anchor="middle" style="animation-delay:.6s">known simply as Pan</text>
  <g class="fade" style="animation-delay:.8s">
    <path class="f1" d="M450 288H580 M620 288H750"/><path class="gold" d="M600 282L606 288L600 294L594 288Z"/><path class="gold" d="M450 285L453 288L450 291L447 288Z"/><path class="gold" d="M750 285L753 288L750 291L747 288Z"/>
  </g>
  <g class="motion">
    <circle r="3.5" class="gold" filter="url(#glint)" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="4.5s" begin="2s" repeatCount="indefinite"/>
      <animateMotion path="M450 288H750" dur="4.5s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g class="motion"><circle class="dust" cx="897" cy="332" r="1" style="animation-duration:9.5s;animation-delay:3.2s"/><circle class="dust" cx="278" cy="391" r="1.6" style="animation-duration:8.6s;animation-delay:1.6s"/><circle class="dust" cx="311" cy="393" r="1.6" style="animation-duration:12.8s;animation-delay:5.8s"/><circle class="dust" cx="203" cy="418" r="1.3" style="animation-duration:12.8s;animation-delay:8.4s"/><circle class="dust" cx="394" cy="369" r="2" style="animation-duration:11.7s;animation-delay:7.3s"/><circle class="dust" cx="1068" cy="379" r="1.3" style="animation-duration:11.4s;animation-delay:2.6s"/><circle class="dust" cx="114" cy="368" r="1" style="animation-duration:9.7s;animation-delay:9.5s"/><circle class="dust" cx="165" cy="387" r="1.6" style="animation-duration:13.9s;animation-delay:7.8s"/><circle class="dust" cx="1038" cy="362" r="1.3" style="animation-duration:13.3s;animation-delay:0.4s"/><circle class="dust" cx="1034" cy="322" r="1.3" style="animation-duration:13.3s;animation-delay:3.8s"/><circle class="dust" cx="633" cy="333" r="1.6" style="animation-duration:11.6s;animation-delay:6.2s"/><circle class="dust" cx="735" cy="406" r="1.6" style="animation-duration:13.1s;animation-delay:4.7s"/><circle class="dust" cx="745" cy="314" r="1.6" style="animation-duration:9.3s;animation-delay:8.2s"/><circle class="dust" cx="696" cy="373" r="1.3" style="animation-duration:12.3s;animation-delay:4.5s"/><circle class="dust" cx="726" cy="355" r="1" style="animation-duration:12.0s;animation-delay:9.4s"/><circle class="dust" cx="378" cy="307" r="1.6" style="animation-duration:10.7s;animation-delay:9.4s"/><circle class="dust" cx="155" cy="354" r="1.3" style="animation-duration:8.3s;animation-delay:1.6s"/><circle class="dust" cx="577" cy="388" r="1.3" style="animation-duration:9.7s;animation-delay:1.0s"/></g>
  <text class="caps fade" x="600" y="334" text-anchor="middle" style="animation-delay:1s">BACKEND &amp; API  ·  WEB &amp; APP  ·  IT AT UTH</text>
